[package]
name = "soreno-relay"
version = "0.1.0"
description = "Accès mobile de Soreno : relais entre les téléphones et les serveurs"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "soreno-relay"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false }
httparse = "1"
libc = "0.2"
serde_json = "1"
soreno-mobile-protocol = { path = "../soreno-mobile-protocol" }
tungstenite = "0.30"
